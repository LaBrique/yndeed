services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: yndeed_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-yndeed}
      POSTGRES_USER: ${DATABASE_USER:-yndeed}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-yndeed_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-yndeed} -d ${DATABASE_NAME:-yndeed}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Django
  web:
    build: .
    container_name: yndeed_web
    restart: unless-stopped
    command: gunicorn Yndeed.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-production-secret-key-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,yndeed.ynov,web}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-yndeed}
      - DATABASE_USER=${DATABASE_USER:-yndeed}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-yndeed_secret_2026}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-nassimmosleh09@gmail.com}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-gpxxosjxtndxksbb}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://yndeed.ynov}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # Worker
  worker:
    build: .
    container_name: yndeed_worker
    restart: unless-stopped
    command: /bin/bash -c "while true; do echo '[WORKER] Collecte des jobs...' && python manage.py collect_jobs && echo '[WORKER] Collecte terminee. Pause 4h.' && sleep 14400; done"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-production-secret-key-change-me}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-yndeed}
      - DATABASE_USER=${DATABASE_USER:-yndeed}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-yndeed_secret_2026}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  # Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: yndeed_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
    name: yndeed_postgres_data
  static_volume:
    name: yndeed_static